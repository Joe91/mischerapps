# Mischer-App on the NAS (Synology / Portainer: Stacks → Add stack → Repository, or `docker compose up -d --build`).
# Before the first start: put config.json (copy of config.example.json with real passwords) into
# /volume1/docker/mischer/config/ – see README, "Auf dem NAS betreiben".
services:
  mischer:
    # Built on the NAS from this repository. No `image:` name on purpose: with one, Portainer's "pull" step
    # tries to download it from Docker Hub ("pull access denied for mischer-app").
    build: .
    container_name: Mischer
    restart: on-failure:5
    user: "1026:100"
    security_opt:
      - no-new-privileges:true
    ports:
      - 9120:8080
    environment:
      TZ: Europe/Berlin
    volumes:
      - /volume1/docker/mischer/config:/config:ro
      - /volume1/docker/mischer/data:/data:rw
