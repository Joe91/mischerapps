# Nextcloud (Apache): allow the apps (Predigt-Schnitt upload, Termine spreadsheet) to read and write files in public share links.
# Copy to /etc/apache2/conf-enabled/ (Debian/Docker image) or include it in the vhost,
# put your app's address into the SetEnvIf line, then reload Apache.
# Needs mod_headers and mod_rewrite (both enabled in the official Nextcloud image).

<IfModule mod_headers.c>
  SetEnvIf Origin "^(https://mischer\.jujo\.myds\.me|http://localhost:5173)$" PREDIGT_ORIGIN=$0
  <LocationMatch "^/public\.php/dav/">
    Header always set Access-Control-Allow-Origin "%{PREDIGT_ORIGIN}e" env=PREDIGT_ORIGIN
    Header always set Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" env=PREDIGT_ORIGIN
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, If-Match, If-None-Match" env=PREDIGT_ORIGIN
    Header always set Access-Control-Expose-Headers "ETag" env=PREDIGT_ORIGIN
    Header always set Access-Control-Max-Age "600" env=PREDIGT_ORIGIN
    Header always merge Vary "Origin"
  </LocationMatch>
</IfModule>

# Answer the CORS preflight directly – Nextcloud itself would reply 401 to it.
<If "%{REQUEST_METHOD} == 'OPTIONS' && %{REQUEST_URI} =~ m#^/public\.php/dav/#">
  Redirect 204
</If>
